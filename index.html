<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05080f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Peak Radar">
    <title>DeepSeek ピークレーダー</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #05080f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .phone {
            width: 100%;
            max-width: 390px;
            padding: 16px;
        }
        .card {
            background: rgba(6, 12, 24, 0.92);
            border-radius: 32px;
            padding: 20px 16px 16px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.03);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px);
            background-size: 18px 18px;
            pointer-events: none;
        }
        .corner {
            position: absolute;
            width: 24px; height: 24px;
            border-color: rgba(0, 229, 255, 0.2);
            border-style: solid;
            border-width: 0;
            pointer-events: none;
            z-index: 2;
        }
        .corner-tl { top: 12px; left: 12px; border-top-width: 2px; border-left-width: 2px; }
        .corner-tr { top: 12px; right: 12px; border-top-width: 2px; border-right-width: 2px; }
        .corner-bl { bottom: 12px; left: 12px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner-br { bottom: 12px; right: 12px; border-bottom-width: 2px; border-right-width: 2px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            position: relative;
            z-index: 3;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00e5ff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            font-size: 7px;
            color: #3a5a7a;
            letter-spacing: 2px;
            margin-top: 1px;
        }
        .settings-btn {
            background: rgba(0,229,255,0.05);
            border: 1px solid rgba(0,229,255,0.15);
            color: #00e5ff;
            font-size: 16px;
            border-radius: 30px;
            width: 34px; height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
        .settings-btn:active { background: rgba(0,229,255,0.15); }

        .ring-wrap {
            position: relative;
            width: 100%;
            max-width: 290px;
            margin: 0 auto;
            aspect-ratio: 1/1;
            z-index: 1;
        }
        #ringCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
        }

        .status-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            margin-top: -2px;
            position: relative;
            z-index: 3;
        }
        .badge {
            display: block;
            width: 100%;
            text-align: center;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: rgba(0,229,255,0.04);
            border: 1px solid rgba(0,229,255,0.1);
        }
        .badge.normal { color: #00e5ff; border-color: #00e5ff; }
        .badge.peak { color: #ff2a4a; border-color: #ff2a4a; animation: blink 1s infinite; }
        @keyframes blink { 0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;} }

        .badge-text {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #5a7a9a;
            min-height: 20px;
            letter-spacing: 0.5px;
        }
        .badge-text.holiday-note { color: #ffa500; }

        .timeline {
            margin: 10px 0 6px;
            position: relative;
            z-index: 3;
        }
        .bar {
            height: 10px;
            background: rgba(16,32,56,0.6);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,229,255,0.06);
        }
        .peak-seg {
            position: absolute;
            height: 100%;
            border-radius: 5px;
        }
        .mark {
            position: absolute;
            top: -2px;
            width: 2px;
            height: 14px;
            background: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 5;
            transition: left 0.5s ease;
        }
        .tl-labels {
            display: flex;
            justify-content: space-between;
            font-size: 6px;
            color: #2a4a6a;
            padding: 0 2px;
            letter-spacing: 1px;
        }
        .rule {
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            color: #00e5ff;
            background: rgba(0,229,255,0.02);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0,229,255,0.04);
            letter-spacing: 0.5px;
            z-index: 3;
            position: relative;
        }
        .rule .p1c { color: #ffa500; }
        .rule .p2c { color: #ff2a4a; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(6,12,24,0.96);
            padding: 24px 20px;
            border-radius: 24px;
            width: 90%;
            max-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(0,229,255,0.15);
        }
        .modal-content h3 {
            color: #00e5ff;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .modal-content label {
            display: block;
            font-size: 9px;
            color: #5a7a9a;
            margin: 10px 0 2px;
            letter-spacing: 1px;
        }
        .modal-content .section-label {
            color: #ffd700;
            font-size: 10px;
            margin-top: 16px;
            margin-bottom: 6px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,215,0,0.1);
            padding-top: 12px;
        }
        .modal-content .ig {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .modal-content .ig input {
            width: 60px;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(0,229,255,0.1);
            background: #0a1420;
            color: #00e5ff;
            font-size: 16px;
            text-align: center;
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .modal-content .ig span { color: #3a5a7a; }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,229,255,0.04);
        }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-row .toggle-label {
            font-size: 9px;
            color: #8aaccc;
            letter-spacing: 0.5px;
            flex: 1;
            padding-right: 8px;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #1a2a3a;
            border-radius: 12px;
            transition: background 0.2s;
            border: 1px solid rgba(0,229,255,0.08);
        }
        .toggle-slider::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 2px;
            top: 2px;
            background: #3a5a7a;
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background: rgba(0,229,255,0.15);
            border-color: rgba(0,229,255,0.3);
        }
        .toggle-switch input:checked + .toggle-slider::after {
            transform: translateX(20px);
            background: #00e5ff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .btn-save { background: #00e5ff; color: #05080f; }
        .btn-close { background: rgba(255,255,255,0.04); color: #5a7a9a; border: 1px solid rgba(255,255,255,0.04); }

        .error-msg {
            font-size: 9px;
            color: #ff2a4a;
            margin-top: 6px;
            min-height: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="card">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>

        <div class="header">
            <div><h1>⚡ DEEPSEEK TAC</h1><div class="sub">// PEAK RADAR v4.0</div></div>
            <button class="settings-btn" id="openSettings">⚙</button>
        </div>

        <div class="ring-wrap">
            <canvas id="ringCanvas"></canvas>
        </div>

        <div class="status-area">
            <div class="badge normal" id="statusBadge">STANDBY</div>
            <div class="badge-text" id="statusText">⏳ ピークまで -- 分</div>
        </div>

        <div class="timeline">
            <div class="bar" id="timelineBar">
                <div class="mark" id="timelineMark" style="left:0%;"></div>
            </div>
            <div class="tl-labels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        </div>

        <div class="rule" id="ruleText">
            <span class="p1c">◈</span> <span id="peak1Label">10:00-13:00</span>
            &nbsp;│&nbsp;
            <span class="p2c">◈</span> <span id="peak2Label">15:00-19:00</span>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3>⚙ ピーク設定</h3>
        <label>◈ ピーク① 開始 / 終了 (時)</label>
        <div class="ig"><input type="number" id="p1s" min="0" max="23" value="10"><span>〜</span><input type="number" id="p1e" min="0" max="23" value="13"></div>
        <label>◈ ピーク② 開始 / 終了 (時)</label>
        <div class="ig"><input type="number" id="p2s" min="0" max="23" value="15"><span>〜</span><input type="number" id="p2e" min="0" max="23" value="19"></div>

        <div class="section-label">営業日設定</div>

        <div class="toggle-row">
            <span class="toggle-label">土日を価格2倍の対象外にする</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggleWeekends" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-label">中国祝日を価格2倍の対象外にする</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggleHolidays" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-label">中国の振替出勤日を営業日として扱う</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggleAdjusted" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="error-msg" id="settingsError"></div>

        <div class="modal-actions">
            <button class="btn-close" id="closeSettings">閉じる</button>
            <button class="btn-save" id="saveSettings">保存</button>
        </div>
    </div>
</div>

<script>
// ============================================================
//  JST固定
// ============================================================
const JST_TIME_ZONE = 'Asia/Tokyo';

const jstFormatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: JST_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23'
});

/**
 * JSTの日時構成要素を取得する。
 * 端末のローカルタイムゾーンに依存しない。
 */
function getJstParts(date) {
    const resolvedDate = date || new Date();
    const parts = Object.fromEntries(
        jstFormatter.formatToParts(resolvedDate)
            .filter(function(p) { return p.type !== 'literal'; })
            .map(function(p) { return [p.type, Number(p.value)]; })
    );
    return {
        year: parts.year,
        month: parts.month,
        day: parts.day,
        hour: parts.hour,
        minute: parts.minute,
        second: parts.second,
        minuteOfDay: parts.hour * 60 + parts.minute
    };
}

/**
 * JST基準の曜日 (0=日曜, 1=月曜, ..., 6=土曜)。
 * 端末ローカルタイムゾーンに依存しない。
 * Tomohiko Sakamotoのアルゴリズムを使用。
 * jstParts (getJstPartsの戻り値) を直接受け取る。
 */
function getJstWeekday(jstParts) {
    // Tomohiko Sakamoto's algorithm
    // 戻り値: 0=日曜, 1=月曜, ..., 6=土曜
    const y = jstParts.year;
    const m = jstParts.month;
    const d = jstParts.day;
    const t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4];
    const y2 = m < 3 ? y - 1 : y;
    return (y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) + t[m - 1] + d) % 7;
}

// ============================================================
//  中国営業日カレンダー
// ============================================================
const CHINA_WORK_CALENDAR = {
    // 2026年: 中国国務院弁公庁通知（2025年11月4日発表）に基づく
    // 根拠: https://www.beijing.gov.cn/cs/gncs/zcwj/202603/t20260327_4568275.html
    2026: {
        holidays: new Set([
            // 元旦: 1/1(木)〜1/3(土) 3連休
            '2026-01-01', '2026-01-02', '2026-01-03',
            // 春節: 2/15(日)〜2/23(月) 9連休（2/14土は振替出勤）
            '2026-02-15', '2026-02-16', '2026-02-17', '2026-02-18',
            '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22',
            '2026-02-23',
            // 清明節: 4/4(土)〜4/6(月)
            '2026-04-04', '2026-04-05', '2026-04-06',
            // 労働節: 5/1(金)〜5/5(火) 5連休（5/9土は振替出勤）
            '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-04',
            '2026-05-05',
            // 端午節: 6/19(金)〜6/21(日)
            '2026-06-19', '2026-06-20', '2026-06-21',
            // 中秋節: 9/25(金)〜9/27(日)
            '2026-09-25', '2026-09-26', '2026-09-27',
            // 国慶節: 10/1(木)〜10/7(水) 7連休（10/10土は振替出勤）
            '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04',
            '2026-10-05', '2026-10-06', '2026-10-07'
        ]),
        adjustedWorkdays: new Set([
            '2026-01-04',   // 元日振替: 日曜出勤
            '2026-02-14',   // 春節振替: 土曜出勤
            '2026-02-28',   // 春節振替: 土曜出勤
            '2026-05-09',   // 労働節振替: 土曜出勤
            '2026-09-20',   // 中秋節振替: 日曜出勤
            '2026-10-10'    // 国慶節振替: 土曜出勤
        ])
    }
};

/**
 * JST日付を YYYY-MM-DD 形式の文字列へ変換する。
 */
function toIsoDate(jstParts) {
    return jstParts.year + '-' +
        String(jstParts.month).padStart(2, '0') + '-' +
        String(jstParts.day).padStart(2, '0');
}

// ============================================================
//  設定
// ============================================================
function readInt(key, fallback) {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === '') return fallback;
    const value = Number(raw);
    return Number.isInteger(value) && value >= 0 && value <= 23
        ? value
        : fallback;
}

function readBool(key, fallback) {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return raw === 'true';
}

let P1S = readInt('peak_p1s', 10);
let P1E = readInt('peak_p1e', 13);
let P2S = readInt('peak_p2s', 15);
let P2E = readInt('peak_p2e', 19);
let excludeWeekends = readBool('deepseek_exclude_weekends', true);
let excludeChinaHolidays = readBool('deepseek_exclude_china_holidays', true);
let useAdjustedWorkdays = readBool('deepseek_use_adjusted_workdays', true);

function saveConfig() {
    localStorage.setItem('peak_p1s', P1S);
    localStorage.setItem('peak_p1e', P1E);
    localStorage.setItem('peak_p2s', P2S);
    localStorage.setItem('peak_p2e', P2E);
    localStorage.setItem('deepseek_exclude_weekends', excludeWeekends);
    localStorage.setItem('deepseek_exclude_china_holidays', excludeChinaHolidays);
    localStorage.setItem('deepseek_use_adjusted_workdays', useAdjustedWorkdays);
    updateLabels();
    drawAll();
}

function updateLabels() {
    document.getElementById('peak1Label').textContent =
        String(P1S).padStart(2,'0')+':00-'+String(P1E).padStart(2,'0')+':00';
    document.getElementById('peak2Label').textContent =
        String(P2S).padStart(2,'0')+':00-'+String(P2E).padStart(2,'0')+':00';
}

// ============================================================
//  ピーク区間判定（分単位・半開区間）
// ============================================================
function isInRange(startHour, endHour, minuteOfDay) {
    var start = startHour * 60;
    var end = endHour * 60;
    if (start === end) return false;
    if (start < end) return minuteOfDay >= start && minuteOfDay < end;
    return minuteOfDay >= start || minuteOfDay < end;
}

function getPeakStatus(minuteOfDay) {
    var p1 = isInRange(P1S, P1E, minuteOfDay);
    var p2 = isInRange(P2S, P2E, minuteOfDay);
    return { peak1: p1, peak2: p2, isPeak: p1 || p2 };
}

// ============================================================
//  営業日判定（優先順位: 振替出勤 > 祝日 > 週末 > 平日）
// ============================================================
function getDayClassification(jstParts) {
    var key = toIsoDate(jstParts);
    var calendar = CHINA_WORK_CALENDAR[jstParts.year];
    var isHoliday = calendar ? calendar.holidays.has(key) : false;
    var isAdjustedWorkday = calendar ? calendar.adjustedWorkdays.has(key) : false;
    var weekday = getJstWeekday(jstParts);
    var isWeekend = weekday === 0 || weekday === 6;

    // 1. 振替出勤日
    if (useAdjustedWorkdays && isAdjustedWorkday) {
        return { kind: 'WORKDAY', isWorkingDay: true, calendarKnown: !!calendar };
    }
    // 2. 中国祝日
    if (excludeChinaHolidays && isHoliday) {
        return { kind: 'HOLIDAY', isWorkingDay: false, calendarKnown: !!calendar };
    }
    // 3. 土日
    if (excludeWeekends && isWeekend) {
        return { kind: 'WEEKEND', isWorkingDay: false, calendarKnown: !!calendar };
    }
    // 4. 通常平日（または振替出勤OFFで adjustedWorkday）
    return {
        kind: isAdjustedWorkday ? 'WORKDAY' : 'NORMAL',
        isWorkingDay: true,
        calendarKnown: !!calendar
    };
}

// ============================================================
//  円弧opacity（即時切替・フェードなし）
// ============================================================
function getArcOpacity(startHour, endHour, minuteOfDay, isWorkingDay) {
    if (!isWorkingDay) return 0.2;
    if (startHour === endHour) return 0.2;
    if (startHour < endHour) {
        return minuteOfDay < endHour * 60 ? 1.0 : 0.2;
    }
    return minuteOfDay >= startHour * 60 || minuteOfDay < endHour * 60
        ? 1.0
        : 0.2;
}

// ============================================================
//  倍率・ステータス
// ============================================================
function getMultiplierAndStatus(jstParts, peakStatus) {
    var day = getDayClassification(jstParts);
    var multiplier = 1.0;
    var badgeText = '';
    var supplementText = '';
    var isPeakClass = false;

    if (!day.isWorkingDay) {
        multiplier = 1.0;
        if (day.kind === 'WEEKEND') {
            badgeText = '◈ WEEKEND (1.0×)';
            supplementText = '本日はピーク料金の対象外';
        } else if (day.kind === 'HOLIDAY') {
            badgeText = '◈ HOLIDAY (1.0×)';
            supplementText = '中国カレンダー休日・本日はピーク料金の対象外';
        }
        return { multiplier: multiplier, badgeText: badgeText, supplementText: supplementText, isPeakClass: false, isWorkingDay: false, dayKind: day.kind, calendarKnown: day.calendarKnown };
    }

    // 営業日
    if (peakStatus.isPeak) {
        multiplier = 2.0;
        isPeakClass = true;
        if (day.kind === 'WORKDAY') {
            badgeText = '⚡ PEAK (2.0×)';
            supplementText = '振替出勤日・割増時間中';
        } else {
            badgeText = '⚡ PEAK (2.0×)';
            supplementText = '⚠ 割増中！ 通常の2倍';
        }
    } else {
        multiplier = 1.0;
        if (day.kind === 'WORKDAY') {
            badgeText = '◈ WORKDAY (1.0×)';
            supplementText = '中国カレンダー振替出勤日';
        } else {
            badgeText = '◈ STANDBY (1.0×)';
            // 次のピークまでの残り時間は別途計算
            supplementText = ''; // 後で上書き
        }
    }

    return { multiplier: multiplier, badgeText: badgeText, supplementText: supplementText, isPeakClass: isPeakClass, isWorkingDay: true, dayKind: day.kind, calendarKnown: day.calendarKnown };
}

// ============================================================
//  カウントダウン（次のピークまで）
// ============================================================
function getMinutesToNextPeak(minuteOfDay) {
    var peaks = [];
    if (P1S < P1E) peaks.push({s: P1S*60, e: P1E*60, overnight: false});
    else { peaks.push({s: P1S*60, e: 1440, overnight: true}); peaks.push({s: 0, e: P1E*60, overnight: false}); }
    if (P2S < P2E) peaks.push({s: P2S*60, e: P2E*60, overnight: false});
    else { peaks.push({s: P2S*60, e: 1440, overnight: true}); peaks.push({s: 0, e: P2E*60, overnight: false}); }

    var minDist = Infinity;
    for (var i = 0; i < peaks.length; i++) {
        var p = peaks[i];
        if (minuteOfDay < p.s) {
            minDist = Math.min(minDist, p.s - minuteOfDay);
        } else if (minuteOfDay < p.e) {
            minDist = 0;
        } else {
            minDist = Math.min(minDist, (1440 - minuteOfDay) + p.s);
        }
    }

    // 次のピーク開始が翌日以降 → Infinity のまま
    // （これにより updateStatus 側で「本日のピーク終了」判定が可能になる）
    if (minDist > 1440 - minuteOfDay) {
        return Infinity;
    }
    return minDist;
}

// ============================================================
//  12時間円弧角度変換
// ============================================================
function hourTo12HourAngle(hour) {
    var normalized = ((hour % 12) + 12) % 12;
    return (normalized / 12) * Math.PI * 2 - Math.PI / 2;
}

// ============================================================
//  Canvas描画
// ============================================================
var canvas = document.getElementById('ringCanvas');
var ctx = canvas.getContext('2d');
var logicalSize = 290;
var currentDevicePixelRatio = 1;

function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    currentDevicePixelRatio = dpr;
    var wrap = canvas.parentElement;
    var displaySize = Math.min(wrap.clientWidth, 290);
    canvas.style.width = displaySize + 'px';
    canvas.style.height = displaySize + 'px';
    canvas.width = displaySize * dpr;
    canvas.height = displaySize * dpr;
    logicalSize = displaySize;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawRing(nowDate) {
    var jst = getJstParts(nowDate);
    var h = jst.hour;
    var m = jst.minute;
    var totalMin = jst.minuteOfDay;

    var W = logicalSize, H = logicalSize, CX = W / 2, CY = W / 2, R = W * 0.38;

    ctx.setTransform(currentDevicePixelRatio, 0, 0, currentDevicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var peakStatus = getPeakStatus(totalMin);
    var statusInfo = getMultiplierAndStatus(jst, peakStatus);

    // ---- 1. ベースリング ----
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,229,255,0.05)';
    ctx.lineWidth = 14;
    ctx.stroke();

    // ---- 2. ピークセグメント（12時間座標） ----
    var drawPeak = function(start, end, color) {
        var op = getArcOpacity(start, end, totalMin, statusInfo.isWorkingDay);
        if (op < 0.05) return;
        ctx.globalAlpha = op;

        var a1 = hourTo12HourAngle(start);
        var a2 = hourTo12HourAngle(end);

        // 12時間円弧では、start === end は描かない
        if (start === end) { ctx.globalAlpha = 1.0; return; }

        // 常に「短い方」を時計回りで描く
        // 12時間座標では、差が6時間以内と仮定してよい
        var drawArc = function(fromAngle, toAngle) {
            ctx.beginPath();
            ctx.arc(CX, CY, R, fromAngle, toAngle);
            ctx.strokeStyle = color;
            ctx.lineWidth = 14;
            ctx.stroke();
        };

        if (start < end) {
            // 同日内: 単純な時計回り
            drawArc(a1, a2);
        } else {
            // 深夜またぎ: 0時で分割
            var midnightAngle = hourTo12HourAngle(0);
            drawArc(a1, midnightAngle);
            drawArc(midnightAngle, a2);
        }
        ctx.globalAlpha = 1.0;
    };

    drawPeak(P1S, P1E, '#ffa500');
    drawPeak(P2S, P2E, '#ff2a4a');

    // ---- 3. 12時間目盛り ----
    for (var i = 0; i < 12; i++) {
        var ang = (i / 12) * Math.PI * 2 - Math.PI / 2;
        var o = R - 2;
        var inn = (i % 3 === 0) ? R - 16 : R - 10;
        ctx.beginPath();
        ctx.moveTo(CX + o * Math.cos(ang), CY + o * Math.sin(ang));
        ctx.lineTo(CX + inn * Math.cos(ang), CY + inn * Math.sin(ang));
        ctx.strokeStyle = (i % 3 === 0) ? 'rgba(0,229,255,0.3)' : 'rgba(0,229,255,0.08)';
        ctx.lineWidth = (i % 3 === 0) ? 1.5 : 0.8;
        ctx.stroke();
    }

    // ---- 4. 12時間文字盤 (12,3,6,9) ----
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.font = 'bold ' + Math.round(W * 0.04) + 'px Orbitron, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    var nums = [12, 3, 6, 9];
    var nAngles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
    for (var ni = 0; ni < nums.length; ni++) {
        var nx = CX + (R - 28) * Math.cos(nAngles[ni]);
        var ny = CY + (R - 28) * Math.sin(nAngles[ni]);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(nums[ni], nx, ny);
    }

    // ---- 5. 針（12時間で1周） ----
    var hour12 = (totalMin % 720) / 720;
    var angleHand = hour12 * Math.PI * 2 - Math.PI / 2;

    var baseLen = R - 2;
    var baseW = 8, tipW = 2, innerLen = 16;
    var ix = CX + innerLen * Math.cos(angleHand);
    var iy = CY + innerLen * Math.sin(angleHand);
    var px = CX + baseLen * Math.cos(angleHand);
    var py = CY + baseLen * Math.sin(angleHand);
    var perpX = -Math.sin(angleHand);
    var perpY = Math.cos(angleHand);

    var p1x = ix + baseW / 2 * perpX, p1y = iy + baseW / 2 * perpY;
    var p2x = ix - baseW / 2 * perpX, p2y = iy - baseW / 2 * perpY;
    var p3x = px - tipW / 2 * perpX, p3y = py - tipW / 2 * perpY;
    var p4x = px + tipW / 2 * perpX, p4y = py + tipW / 2 * perpY;

    var grad2 = ctx.createLinearGradient(ix, iy, px, py);
    grad2.addColorStop(0, '#ffd700');
    grad2.addColorStop(0.7, '#ffb300');
    grad2.addColorStop(1, '#fff5c0');
    ctx.shadowColor = 'rgba(255,215,0,0.5)';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
    ctx.lineTo(p3x, p3y); ctx.lineTo(p4x, p4y);
    ctx.closePath();
    ctx.fillStyle = grad2;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(CX, CY, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,215,0,0.7)';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ---- 6. デジタル時刻 (HH:MM と JSTのみ) ----
    var hhStr = String(jst.hour).padStart(2, '0');
    var mmStr = String(jst.minute).padStart(2, '0');
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = -2;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(W * 0.12) + 'px Orbitron, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(hhStr + ':' + mmStr, CX, CY - 4);
    ctx.shadowColor = 'rgba(0,229,255,0.3)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillText(hhStr + ':' + mmStr, CX, CY - 4);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = 'rgba(0,229,255,0.3)';
    ctx.font = Math.round(W * 0.026) + 'px Orbitron, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillText('JST', CX, CY + 26);

    // Canvas内にカウントダウンは描画しない（削除）
}

// ============================================================
//  タイムライン（24時間維持）
// ============================================================
function updateTimeline(nowDate) {
    var jst = getJstParts(nowDate);
    var bar = document.getElementById('timelineBar');
    bar.querySelectorAll('.peak-seg').forEach(function(el) { el.remove(); });

    var addSeg = function(s, e, c) {
        if (s < e) {
            var d = document.createElement('div');
            d.className = 'peak-seg';
            d.style.left = ((s / 24) * 100) + '%';
            d.style.width = (((e - s) / 24) * 100) + '%';
            d.style.background = c;
            bar.appendChild(d);
        } else {
            var d1 = document.createElement('div');
            d1.className = 'peak-seg';
            d1.style.left = ((s / 24) * 100) + '%';
            d1.style.width = (((24 - s) / 24) * 100) + '%';
            d1.style.background = c;
            bar.appendChild(d1);
            var d2 = document.createElement('div');
            d2.className = 'peak-seg';
            d2.style.left = '0%';
            d2.style.width = ((e / 24) * 100) + '%';
            d2.style.background = c;
            bar.appendChild(d2);
        }
    };
    addSeg(P1S, P1E, 'rgba(255,165,0,0.5)');
    addSeg(P2S, P2E, 'rgba(255,42,74,0.5)');

    var p = (jst.minuteOfDay / 1440) * 100;
    document.getElementById('timelineMark').style.left = Math.min(100, p) + '%';
}

// ============================================================
//  ステータス表示（別行）
// ============================================================
function updateStatus(nowDate) {
    var jst = getJstParts(nowDate);
    var totalMin = jst.minuteOfDay;
    var peakStatus = getPeakStatus(totalMin);
    var statusInfo = getMultiplierAndStatus(jst, peakStatus);
    var badge = document.getElementById('statusBadge');
    var textEl = document.getElementById('statusText');

    badge.textContent = statusInfo.badgeText;
    badge.className = 'badge';
    if (statusInfo.isPeakClass) {
        badge.classList.add('peak');
    } else {
        badge.classList.add('normal');
    }

    // 補足文
    if (statusInfo.isWorkingDay && !statusInfo.isPeakClass && statusInfo.dayKind !== 'WORKDAY') {
        // STANDBY: カウントダウン表示
        var mins = getMinutesToNextPeak(totalMin);
        if (mins === Infinity) {
            textEl.textContent = '⏳ 本日のピーク終了';
        } else if (mins === 0) {
            textEl.textContent = '⚠ 割増中！ 通常の2倍';
        } else if (mins < 60) {
            textEl.textContent = '⏳ あと ' + mins + ' 分';
        } else {
            var hh2 = Math.floor(mins / 60);
            var mm2 = mins % 60;
            textEl.textContent = '⏳ あと ' + hh2 + 'h' + String(mm2).padStart(2, '0') + 'm';
        }
        // カレンダー未登録年度の注釈
        if (!statusInfo.calendarKnown) {
            textEl.textContent += ' (祝日データ未登録)';
        }
    } else {
        textEl.textContent = statusInfo.supplementText;
        // 未登録年度の場合
        if (statusInfo.dayKind === 'HOLIDAY' && !statusInfo.calendarKnown) {
            // 祝日データ未登録でも設定に従う
        }
    }
}

// ============================================================
//  統合描画
// ============================================================
function drawAll(nowDate) {
    var date = nowDate || new Date();
    drawRing(date);
    updateTimeline(date);
    updateStatus(date);
    updateLabels();
}

// ============================================================
//  モーダル
// ============================================================
document.getElementById('openSettings').addEventListener('click', function() {
    document.getElementById('p1s').value = P1S;
    document.getElementById('p1e').value = P1E;
    document.getElementById('p2s').value = P2S;
    document.getElementById('p2e').value = P2E;
    document.getElementById('toggleWeekends').checked = excludeWeekends;
    document.getElementById('toggleHolidays').checked = excludeChinaHolidays;
    document.getElementById('toggleAdjusted').checked = useAdjustedWorkdays;
    document.getElementById('settingsError').textContent = '';
    document.getElementById('settingsModal').style.display = 'flex';
});

document.getElementById('closeSettings').addEventListener('click', function() {
    document.getElementById('settingsModal').style.display = 'none';
});

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === e.currentTarget) {
        document.getElementById('settingsModal').style.display = 'none';
    }
});

document.getElementById('saveSettings').addEventListener('click', function() {
    var v1s = parseInt(document.getElementById('p1s').value);
    var v1e = parseInt(document.getElementById('p1e').value);
    var v2s = parseInt(document.getElementById('p2s').value);
    var v2e = parseInt(document.getElementById('p2e').value);

    if ([v1s, v1e, v2s, v2e].some(function(v) { return isNaN(v) || v < 0 || v > 23; })) {
        document.getElementById('settingsError').textContent = '0〜23の数字を入力してください';
        return;
    }

    // 開始＝終了は保存拒否
    if (v1s === v1e) {
        document.getElementById('settingsError').textContent = 'ピーク①の開始と終了が同じです';
        return;
    }
    if (v2s === v2e) {
        document.getElementById('settingsError').textContent = 'ピーク②の開始と終了が同じです';
        return;
    }

    P1S = v1s; P1E = v1e; P2S = v2s; P2E = v2e;
    excludeWeekends = document.getElementById('toggleWeekends').checked;
    excludeChinaHolidays = document.getElementById('toggleHolidays').checked;
    useAdjustedWorkdays = document.getElementById('toggleAdjusted').checked;

    saveConfig();
    document.getElementById('settingsModal').style.display = 'none';
    drawAll(new Date());
});

// ============================================================
//  初期化・タイマー・復帰処理
// ============================================================
var updateTimer = null;

function tick() {
    var now = new Date();
    drawRing(now);
    updateStatus(now);
    var jst = getJstParts(now);
    var p = (jst.minuteOfDay / 1440) * 100;
    document.getElementById('timelineMark').style.left = Math.min(100, p) + '%';
}

function init() {
    updateLabels();
    resizeCanvas();
    drawAll(new Date());

    // 1秒間隔で更新（単一タイマーに統合）
    updateTimer = setInterval(tick, 1000);

    // リサイズ
    window.addEventListener('resize', resizeCanvas);

    // 復帰時即時再描画
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            var now = new Date();
            resizeCanvas();
            drawAll(now);
        }
    });
}

init();
</script>
